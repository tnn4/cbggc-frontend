name: Deploy GitHub Pages Site

on:
  push:
    branches: ["main"] # Change to your default branch name if different
    paths:
      # - "data/sheet-data.json" # Triggers deployment when this specific file updates
      - "bg-list.json"
      - "index.html" # Triggers deployment when front-end files update
      - "js/**"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # Uploads the root directory containing your index.html and data/ folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
